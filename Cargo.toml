[workspace]
resolver = "2"
members = ["src-tauri", "crates/mc-core", "crates/mc-explorer-command"]

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"
rand = "0.9"
unicode-normalization = "0.1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
